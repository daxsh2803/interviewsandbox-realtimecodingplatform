version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: interview_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interview_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: interview_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: interview_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/interview_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-fallback_secret_do_not_use_in_prod}
      - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-http://localhost:8080}
      - JUDGE0_BASE_URL=${JUDGE0_BASE_URL:-http://localhost:2358}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY:-}
      - JUDGE0_CALLBACK_URL=${JUDGE0_CALLBACK_URL:-http://localhost:5000/api/executions/judge0/callback}
      - JUDGE0_CALLBACK_SECRET=${JUDGE0_CALLBACK_SECRET:-fallback_judge0_webhook_secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: interview_frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
