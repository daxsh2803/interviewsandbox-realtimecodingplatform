name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Project Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate backend source
        run: node --check backend/server.js

      - name: Start Docker services
        run: docker compose up -d postgres redis

      - name: Wait for PostgreSQL
        run: |
          while ! docker exec interview_postgres pg_isready -h 127.0.0.1 -U postgres -d interview_db; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run database migrations
        run: npm run migrate --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/interview_db

      - name: Run backend tests
        run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5433/interview_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: supersecret_test
          JUDGE0_CALLBACK_SECRET: secret_token_for_webhooks

      - name: Build frontend
        run: npm run build -w frontend

      - name: Stop Docker services
        if: always()
        run: docker compose down
